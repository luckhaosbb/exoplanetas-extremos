<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="spaceAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#9900ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="35%" stop-color="#ff4500"/>
      <stop offset="75%" stop-color="#6a0dad"/>
      <stop offset="100%" stop-color="#0c071e"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="45%" stop-color="#ffb700"/>
      <stop offset="80%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <linearGradient id="ringShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura de Radiação Cósmica -->
  <circle cx="32" cy="32" r="30" fill="url(#spaceAura)"/>

  <!-- Anel Traseiro (atrás do planeta) -->
  <g transform="rotate(-25 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="7" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="0 0 55 100" opacity="0.9" filter="url(#glow)"/>
    <ellipse cx="32" cy="32" rx="23" ry="5.5" fill="none" stroke="#00f3ff" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- Corpo do Exoplaneta Hostil -->
  <circle cx="32" cy="32" r="17" fill="url(#planetBody)"/>

  <!-- Atmosfera / Brilho de Borda Superior -->
  <path d="M 16 28 A 17 17 0 0 1 47 25 A 17 17 0 0 0 16 28" fill="#ffffff" opacity="0.35"/>

  <!-- Faixas Atmosféricas Hostis -->
  <path d="M 15.5 32 Q 32 37 48.5 32 Q 32 39 15.5 32" fill="#ff2200" opacity="0.5"/>
  <path d="M 17 38 Q 32 43 47 38 Q 32 45 17 38" fill="#3a0463" opacity="0.7"/>

  <!-- Anel Frontal (na frente do planeta) -->
  <g transform="rotate(-25 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="7" fill="none" stroke="url(#ringGrad)" stroke-width="3.2" stroke-dasharray="54 100" stroke-dashoffset="0" filter="url(#glow)"/>
    <ellipse cx="32" cy="32" rx="23" ry="5.5" fill="none" stroke="#00f3ff" stroke-width="1.2" stroke-dasharray="46 100" opacity="0.8"/>
  </g>

  <!-- Ponto de Brilho / Estrela Telemetria -->
  <circle cx="49" cy="14" r="1.5" fill="#00f3ff" opacity="0.9"/>
  <circle cx="12" cy="48" r="1" fill="#ffb700" opacity="0.8"/>
</svg>
